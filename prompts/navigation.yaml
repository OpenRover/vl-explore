# This is the template boilerplate for navigation prompts
# ==============================================================================
# Each entry can have an accumulative weight that will be multiplied with other
# hierarchies. The final weight will be the product of all the weights in the
# hierarchy.
# ==============================================================================
# Author: Yuxuan Zhang (robotics@z-yx.cc)
# License: MIT
# ==============================================================================

templates:
  neutral:
    - a {} @ 1.0
    - an image of a {}
    - a photo of a {}
    - a cropped photo of a {}
  negative:
    - an incomplete photo of a {}
    - a corrupted photo of a {}
    - a bad photo of a {}
    # Useful when a slice does not contain enough information
    - an (unknown|unidentified|unrecognizable) (item|object|thing|picture)
    # Maybe too close to an object
    - an empty photo
    - a photo with nothing in it
    - a meaningless photo

states:
  positive:
    - (flat|open|wide|clear|clean|smooth) {}
    - (empty|spacious|navigable) {}
    - (flat|open|clear) (gateway|doorway|entrance)
  negative:
    - (blocked|cluttered|messy|crowded) (space|scene)
    - (closed|blocked) (gateway|doorway|entrance)
    - large {}
    - way blocking {}
    - "{} behind a clear glass"
    - (transparent|clear|reflective) glass

objects:
  positive:
    - (way|path|road)
    - (aisle|hallway|walkway|corridor)
    - (floor|ground)
  negative:
    - wall
    - item
    - barrier
    - obstacle
    - blockage
    - blockade
    - barricade
    - staircase
    - object
    - structure
    - (box|paper box|cardboard)
